spring.application.name=grade-mssql
server.port=8080

# DB: compose 에서는 GRADES_JDBC_URL 로 mssql 서비스 주소를 넘긴다.
spring.datasource.url=${GRADES_JDBC_URL:jdbc:sqlserver://localhost:1433;databaseName=grades;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${GRADES_DB_USER:app}
spring.datasource.password=${GRADES_DB_PASSWORD:App-pass1234!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# DB 가 아직 안 떠 있어도 앱은 뜬다. 요청 시점에 연결한다.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=5000

logging.level.root=INFO
