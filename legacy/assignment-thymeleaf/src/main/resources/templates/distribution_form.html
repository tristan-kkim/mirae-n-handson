<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{layout :: head('새 배포')}"></head>
<body>
<nav th:replace="~{layout :: nav(${menu})}"></nav>
<h2>새 배포</h2>
<div th:replace="~{layout :: flash}"></div>
<form method="post" th:action="@{/distributions}">
    <p>
        <label for="assignmentId">과제</label>
        <select id="assignmentId" name="assignmentId" required>
            <option value="">-- 과제 선택 --</option>
            <!-- 마감 지난 과제는 선택 불가 (연장 상태 제외) -->
            <option th:each="a : ${assignments}"
                    th:value="${a.id}"
                    th:disabled="${a.dueAt != null and a.dueAt.isBefore(now) and a.status != 'X'}"
                    th:text="${a.id} + '. ' + ${a.title} + ' (' + ${a.unitCode} + ', 마감 ' + ${#temporals.format(a.dueAt, 'MM-dd HH:mm')} + ')'
                             + (${a.dueAt != null and a.dueAt.isBefore(now)} ? (${a.status == 'X'} ? ' [연장]' : ' [마감]') : '')"></option>
        </select>
    </p>
    <p>
        <label for="classId">학급</label>
        <select id="classId" name="classId" required>
            <option value="">-- 학급 선택 --</option>
            <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name} + ' (' + ${c.teacherId} + ')'"></option>
        </select>
    </p>
    <p>
        <button type="submit">배포</button>
    </p>
</form>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
